.pipe button:first-child { border-radius: var(--r) 0 0 var(--r); }
.pipe button:last-child { border-right: 1px solid var(--line); border-radius: 0 var(--r) var(--r) 0; }
.pipe button span { font: 500 11.5px var(--font-data); color: var(--muted); display: block; }
.pipe button b { font: 600 18px/1.2 var(--font-display); display: block; margin-top: 2px; }

.daily div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: 14.5px; }
.daily time { display: block; font: 600 22px var(--font-display); color: var(--highlight); margin-bottom: 4px; font-variant-numeric: tabular-nums; }

.search { width: 100%; font: 15px var(--font-body); padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); margin: 14px 0 4px; }
.empty { color: var(--muted); font-size: 14.5px; padding: 10px 14px; }

code { font: 13.5px var(--font-data); background: var(--accent-wash); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); }
.pager a { display: block; text-decoration: none; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; font: 500 11.5px var(--font-data); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager b { font: 600 17px var(--font-display); }
.pager .next { text-align: right; grid-column: 2; }
.keys { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 14px; }
kbd { font: 12px var(--font-data); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

@media (prefers-reduced-motion: no-preference) { .page { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(6px); } } }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }

<script>
const tbl = (head, rows, cls = []) =>
  `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map((c, i) => `<td class="${cls[i] || ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

/* ---------- comparison data (chapter 5) ---------- */
const CMP = [
  ["Bank quarterly results (40 banks)", "yes", "All 40 banks, June 2020 to Sept 2026. HDFC Bank's Q4 FY26 matches Indus to the rupee."],

/* ---------- glossary (chapter 10) ---------- */
const GLOSS = [
  ["RBI", "Reserve Bank of India, the central bank. It publishes most of the industry data."],
  ["MoSPI", "Ministry of Statistics. Publishes inflation (CPI) every month."],
  ["NSE", "National Stock Exchange. Listed companies file their results here."],
  ["NBFC", "Non-bank finance company: lends money but isn't a bank (e.g. Bajaj Finance)."],
  ["HFC", "Housing finance company: an NBFC that mainly gives home loans (e.g. LIC Housing)."],
  ["PSU bank", "A government-owned bank, such as SBI or Bank of Baroda."],
  ["SFB", "Small finance bank: a smaller bank focused on small borrowers."],
  ["Repo rate", "The RBI's main interest rate. When it moves, loan and deposit rates should follow."],
  ["MCLR", "A bank's own benchmark lending rate. Many older floating-rate loans are linked to it."],
  ["CASA", "Current and savings account deposits. Cheap money for a bank, so a higher share is better."],
  ["NII", "Net interest income: interest earned minus interest paid."],
  ["NPA", "Non-performing asset: a loan that has stopped being repaid. A bad loan."],
  ["Stage 3", "The NBFC word for bad loans."],
  ["PCR", "Provision coverage ratio: how much of the bad loans the lender has already set money aside for."],
  ["CET1", "The strongest form of bank capital, as a share of risky assets."],
  ["RoA", "Return on assets: profit as a share of everything the lender owns."],
  ["AUM", "Assets under management: the loans an NBFC manages."],
  ["P/B", "Price-to-book: market value divided by the company's own capital."],
  ["P/E", "Price-to-earnings: market value divided by a year's profit."],
  ["BSR-1 / BSR-2", "RBI's Basic Statistical Returns: big yearly surveys of bank loans (1) and deposits (2)."],
  ["DBIE", "RBI's database website, data.rbi.org.in, where the detailed tables live."],
  ["XBRL", "A machine-readable version of a company's results, filed with the exchange."],
  ["Bhavcopy", "NSE's daily file of closing share prices."],
  ["Crore / lakh crore", "1 crore = 10 million. ₹1 lakh crore = ₹1 trillion."],
  ["FY26, Q4", "India's financial year runs April to March. FY26 ended March 2026; Q4 is January to March."],
];

/* ---------- pipeline stages (chapter 6) ---------- */
const STAGES = [
  { n: "Fetch", s: "Download new files", body: `
    <p>Each evening the program visits every source and downloads only what's new.</p>
    ${tbl(["Source", "What it downloads", "How often"], [
      ["RBI website", "Credit by sector, lending and deposit rates, card statistics, banks' fortnightly statement", "Monthly"],

      ["MoSPI", "Consumer price inflation", "Monthly"],
      ["RBI announcements", "Repo rate decisions", "After each policy meeting"],
      ["NSE filings", "Each company's quarterly results (XBRL)", "Quarterly"],
      ["NSE announcements", "Each company's latest investor presentation (PDF)", "Quarterly"],
      ["NSE bhavcopy", "Closing share prices", "Daily"],
    ], ["k"])}
    <div class="note"><b>Why a hidden browser?</b> RBI's file server blocks simple scripts, and its database only hands out tables through an interactive viewer. So the program opens an invisible Chrome window, clicks through like a person would, and saves the Excel export.</div>` },
  { n: "Clean", s: "Turn files into tidy tables", body: `
    <p>Every kind of file has its own reader, and everything ends up in one database file, <code>data\\bank.db</code>. The readers find rows by their <b>names</b> (like "Housing"), not their position, because RBI moves rows around now and then.</p>
    <ul>
      <li><b>Units:</b> older RBI books use ₹ million, newer ones ₹ crore. Everything becomes ₹ crore.</li>
      <li><b>Missing quarters:</b> if NSE has lost a quarter's file, it is rebuilt from year-to-date totals and marked with *.</li>
      <li><b>Filing mistakes:</b> some banks report return on assets per quarter and others per year; a few wrote 13% capital as 0.13%. Both are spotted and fixed.</li>

      <li>The program checks those words really are on that page and contain the number.</li>
      <li>It checks the value is sensible (a CASA ratio of 400% gets thrown out).</li>

  { n: "Calculate", s: "Work out the measures", body: `

    <p>Examples: growth compared with a year earlier, credit growth minus inflation, how much of a repo change reached loan rates, market value from share price × shares, and price-to-book from market value ÷ capital.</p>` },
  { n: "Build", s: "Make the website file", body: `
    <p>Finally it pours every number into the website file <code>reports\\india_banking_monitor.html</code>. Double-click it to open. It works offline and needs no server.</p>
    <p>The online copy on claude.ai is a separate copy; it updates when you ask Claude Code to "republish the site".</p>` },
];

  { id: "flow", t: "How the data flows", html: () => `
    <p class="eyebrow">From download to website</p>
    <h1>Five steps turn raw downloads into the website.</h1>
    <p class="lede">The same five steps run every evening. Click a step to see what happens in it.</p>
    <div class="pipe" role="tablist" aria-label="Pipeline steps">
      ${STAGES.map((s, i) => `<button type="button" role="tab" id="tab${i}" aria-controls="stage" aria-selected="${i === 0}"><span>Step ${i + 1}</span><b>${s.n}</b><small>${s.s}</small></button>`).join("")}
    </div>
    <div class="stage" id="stage" role="tabpanel"></div>`,
    after: () => {
      const tabs = [...document.querySelectorAll(".pipe button")], panel = document.getElementById("stage");
      const show = i => { tabs.forEach((t, j) => t.setAttribute("aria-selected", i === j)); panel.innerHTML = `<h2>Step ${i + 1}: ${STAGES[i].n}</h2>` + STAGES[i].body; panel.setAttribute("aria-labelledby", "tab" + i); };
      tabs.forEach((t, i) => { t.onclick = () => show(i); t.onkeydown = e => {
        if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); e.stopPropagation(); const n = (i + 1) % tabs.length; tabs[n].focus(); show(n); }
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); e.stopPropagation(); const n = (i + tabs.length - 1) % tabs.length; tabs[n].focus(); show(n); }
      }; });
      show(0);
    } },

  { id: "glossary", t: "Glossary", html: () => `

    <input id="gq" class="search" type="search" placeholder="Type a term, e.g. CASA" autocomplete="off">

    after: () => {
      const body = document.getElementById("gl"), q = document.getElementById("gq");
      const draw = () => { const s = q.value.trim().toLowerCase();
        const rows = GLOSS.filter(g => !s || (g[0] + " " + g[1]).toLowerCase().includes(s));
        body.innerHTML = rows.length ? rows.map(g => `<tr><td class="k">${g[0]}</td><td>${g[1]}</td></tr>`).join("") : `<tr><td colspan="2" class="empty">No term matches "${s.replace(/</g, "&lt;")}". Try a shorter word.</td></tr>`; };

/* ---------- router ---------- */
const toc = document.getElementById("toc"), sel = document.getElementById("chap"), page = document.getElementById("page");
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem("guide-seen") || "[]")); } catch (e) {}
toc.innerHTML = CH.map((c, i) => `<li><a href="#${c.id}" data-id="${c.id}"><span>${String(i + 1).padStart(2, "0")}</span>${c.t}</a></li>`).join("");
sel.innerHTML = CH.map((c, i) => `<option value="${c.id}">${i + 1}. ${c.t}</option>`).join("");
sel.onchange = () => { location.hash = sel.value; };

function render() {
  const id = location.hash.slice(1);
  let i = CH.findIndex(c => c.id === id); if (i < 0) i = 0;
  const c = CH[i], prev = CH[i - 1], next = CH[i + 1];
  page.innerHTML = c.html() + `<div class="pager">
    ${prev ? `<a class="prev" href="#${prev.id}"><small>← Previous</small><b>${prev.t}</b></a>` : ""}
    ${next ? `<a class="next" href="#${next.id}"><small>Next →</small><b>${next.t}</b></a>` : ""}
  </div><p class="keys">Use <kbd>←</kbd> <kbd>→</kbd> to move between chapters</p>`;
  c.after && c.after();
  seen.add(c.id); try { localStorage.setItem("guide-seen", JSON.stringify([...seen])); } catch (e) {}
  toc.querySelectorAll("a").forEach(a => { a.toggleAttribute("aria-current", a.dataset.id === c.id); if (a.dataset.id === c.id) a.setAttribute("aria-current", "page"); a.classList.toggle("read", seen.has(a.dataset.id) && a.dataset.id !== c.id); });
  sel.value = c.id;
  document.getElementById("bar").style.width = ((i + 1) / CH.length * 100) + "%";
  document.title = (i ? c.t + " · " : "") + "India Banking Monitor Guide";
  window.scrollTo(0, 0);
}
addEventListener("hashchange", () => { render(); document.getElementById("main").focus({ preventScroll: true }); });
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea, [role=tab]")) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const i = Math.max(0, CH.findIndex(c => c.id === location.hash.slice(1)));
  if (e.key === "ArrowRight" && CH[i + 1]) location.hash = CH[i + 1].id;
  if (e.key === "ArrowLeft" && i > 0) location.hash = CH[i - 1].id;
});
render();
</script>
